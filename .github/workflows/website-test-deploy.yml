name: Website test deployment

on:
  pull_request:
    branches:
      - main
      - redesign
    paths:
      - 'website/**'

    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - converted_to_draft
  workflow_dispatch:
jobs:
  test-deploy:
    if: ${{ (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null))) }}
    name: Test Deployment
    runs-on: ubuntu-latest
    steps:
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          cd website
          nix-shell -p yarn --run "yarn install --frozen-lockfile"
      - name: Test Build
        run: |
          cd website
          nix-shell -p yarn --run "yarn build"
concurrency:
  group: batch-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && github.run_id || 'candidate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
